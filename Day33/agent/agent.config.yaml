# Day31 agent configuration.
#
# One file turns capabilities on and off. Every memory layer is ENABLED by
# default — you only list a layer here to disable it or tune it. RAG and MCP are
# opt-in. The orchestrator spawns sub-agents from the roster below and routes
# their results between one another.
#
# Precedence (low → high): built-in defaults → this file → explicit CLI flags.
# Run with:  ./ai-adv-agent --config agent.config.yaml --query "…"
#        or  ./ai-adv-agent --config agent.config.yaml --interactive

llm:
  # provider / model / api_key are read from LLM_PROVIDER / LLM_MODEL /
  # LLM_API_KEY when left empty here — keep secrets in the environment.
  provider: ""          # openai | openrouter | gigachat  (env: LLM_PROVIDER)
  model: ""             # env: LLM_MODEL
  base_url: ""          # env: LLM_BASE_URL (provider default when empty)
  temperature: null     # null = provider default
  max_tokens: 0         # 0 = no limit
  context_window: 0     # 0 = no client-side prompt cap
  ca_cert: ""           # PEM cert for a self-signed HTTPS endpoint (private LiteLLM)

memory:
  dir: chat_history.json  # base path; each layer's file is derived from it
  auto_update: false      # refresh WM + LTM with an extra LLM call after each turn
  stm:  { enabled: true, limit: 10, summary: false }
  wm:   { enabled: true }
  ltm:  { enabled: true }
  facts: { enabled: true }
  profile: { enabled: true }
  task_memory: { enabled: true }
  # To disable a layer, e.g.:
  #   ltm: { enabled: false }

rag:
  enabled: false          # set true and point db/embed_* at your index
  db: rag.db
  embed_url: http://localhost:11434
  embed_model: nomic-embed-text
  top_k: 20
  threshold: 0.5
  top_k_final: 10
  rerank:
    enabled: false
    model: ""             # empty → main LLM model
    mode: auto            # api | chat | auto

mcp:
  enabled: true
  # Inline servers, or point `file:` at an existing MCP YAML.
  # file: chat_history.mcp.yaml
  servers:
    # Read-only local git inspection: git_current_branch / git_list_files / git_diff.
    # Build first: cd ../git-mcp-server && make build
    - name: git
      type: stdio
      command: ../git-mcp-server/git-mcp-server
      args: ["-repo", "."]
  #   - { name: petstore, type: sse, url: "http://127.0.0.1:8931/sse" }

invariants:
  enabled: false
  path: ""                # empty → derived from memory.dir

# Documentation-consultant mode: /help in the interactive session switches into
# a grounded Q&A over the project docs index (+ git MCP tools), /end switches
# back. The embed model MUST match the one docs.db was indexed with.
consultant:
  enabled: true
  rag:
    enabled: true
    db: ../rag/docs.db
    embed_url: http://127.0.0.1:1234
    embed_model: text-embedding-nomic-embed-text-v2-moe
    top_k: 12
    threshold: 0.35
    top_k_final: 6
    rerank:
      enabled: true
      model: cohere/rerank-4-fast   # пусто → основная LLM-модель
      mode: auto
  mcp: ["git"]            # tools the consultant may call (server allow-list)

orchestrator:
  enabled: true
  max_rounds: 8
  subagents:
    - name: researcher
      prompt: >
        Ты аналитик-исследователь. Собираешь факты и контекст по задаче,
        отвечаешь кратко и по делу, ссылаешься на найденные источники.
      rag: true            # grant RAG (requires rag.enabled)
      mcp: ["git"]         # e.g. ["petstore"] or ["*"] for all servers
      memory: { wm: true }
    - name: coder
      prompt: >
        Ты инженер. Пишешь и правишь код по переданному контексту и требованиям.
        Возвращаешь готовый результат, без лишних объяснений.
      rag: false
      mcp: []
      memory: { wm: true }
    - name: reviewer
      prompt: >
        Ты ревьюер. Проверяешь результат предыдущих агентов на корректность,
        риски и соответствие задаче. Возвращаешь вердикт и список правок.
        Для проверки локальных изменений используй git-инструменты
        (git_current_branch, git_list_files, git_diff).
      rag: false
      mcp: ["git"]
      memory: { wm: false }
